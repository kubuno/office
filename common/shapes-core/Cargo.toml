[package]
name        = "kubuno-office-shapes-core"
description = "Kubuno Office's shared shape geometry: the OOXML preset engine (LibreOffice's 144 preset geometries, their guide equations, text frames and adjustment handles), the suite's native fraction-adjusted geometries and the shape catalogue — a port of the web's office/web/src/shapes, used by every office editor that draws shapes. No UI, no Windows API."
version     = "0.1.0"
edition     = "2021"
license     = "AGPL-3.0-or-later"
repository  = "https://github.com/kubuno/office"

# Platform-neutral on purpose: it must keep building for `wasm32-unknown-unknown`, Linux and macOS.
# Never add a UI, Windows or C dependency here. Paths come out as plain commands (move, line, cubic,
# quadratic, SVG arc, close) that each platform hands to its own drawing API.
[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
