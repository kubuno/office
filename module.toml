# ── Admin panel pages ─────────────────────────────────────────────────────────
# Each becomes an entry of the admin menu (Modules → Office), at its own address
# (/admin/modules/office/<id>). A setting's `group` places it on a page.

# Access first, then retention, then one page per editor of the suite in the
# order the launcher lists them: an administrator opens this panel to answer
# "who can see what" far more often than "what colour is a new project".

[[setting_groups]]
id          = "sharing"
label       = "Partage"
icon        = "Share2"
position    = 1
description  = "Les liens de partage public d'un document : autorisation accordée et durée de vie."

[[setting_groups]]
id          = "retention"
label       = "Conservation"
icon        = "Archive"
position    = 2
description  = "Combien de révisions sont gardées par document, et combien de temps un élément survit dans la corbeille."

[[setting_groups]]
id          = "documents"
label       = "Documents"
icon        = "FileText"
position    = 3
description  = "Les valeurs par défaut d'un nouveau document texte : format d'enregistrement, sauvegarde automatique, suivi des modifications, marges."

[[setting_groups]]
id          = "spreadsheet"
label       = "Tableur"
icon        = "Table"
position    = 4
description  = "Les valeurs par défaut d'un nouveau classeur : format d'enregistrement, sauvegarde automatique, ligne d'en-tête."

[[setting_groups]]
id          = "presentations"
label       = "Présentations"
icon        = "Presentation"
position    = 5
description  = "Le format des diapositives d'une nouvelle présentation."

[[setting_groups]]
id          = "diagrams"
label       = "Diagrammes"
icon        = "Workflow"
position    = 6
description  = "Le comportement de la grille d'un nouveau diagramme."

[[setting_groups]]
id          = "projects"
label       = "Projets"
icon        = "FolderKanban"
position    = 7
description  = "Les valeurs par défaut d'un nouveau projet."

[[setting_groups]]
id          = "data"
label       = "Données"
icon        = "ChartColumn"
position    = 8
description  = "La palette de couleurs par défaut des visuels d'un nouveau rapport."

[[setting_groups]]
id          = "whiteboard"
label       = "Tableau blanc"
icon        = "PenTool"
position    = 9
description  = "Le fond par défaut d'un nouveau tableau blanc."

[[setting_groups]]
id          = "maths"
label       = "Maths"
icon        = "Sigma"
position    = 10
description  = "La sauvegarde automatique de l'éditeur de mathématiques."

[[setting_groups]]
id          = "script"
label       = "Script"
icon        = "Code"
position    = 11
description  = "La sauvegarde automatique de l'éditeur de scripts."

# ── Settings manifest ───────────────────────────────────────────────────────────
# Declarative source of truth for the module's instance-wide parameters. The core
# seeds the global|overridable scopes into core.settings and exposes them in the
# admin console. Per-user preferences stay inside the module's own settings page.
#   scope = "global"      → admin only, instance-wide
#   scope = "user"        → per-user only
#   scope = "overridable" → admin default, each user may override it

[[settings]]
key     = "default_format"
scope   = "global"
group   = "documents"
type    = "enum"
default = "docx"
label   = "Format de document par défaut"
description = "Format appliqué à l'export et à la création de nouveaux documents."
values  = [
    { value = "docx", label = ".docx (Microsoft Word)" },
    { value = "odt",  label = ".odt (OpenDocument Text)" },
]

[[settings]]
key     = "autosave_interval_s"
scope   = "global"
group   = "documents"
public  = true
type    = "int"
default = 30
label   = "Intervalle de sauvegarde automatique (secondes)"
description = "Délai entre deux enregistrements automatiques. 0 désactive la sauvegarde automatique."

[[settings]]
key     = "default_margins_mm"
scope   = "global"
group   = "documents"
type    = "int"
default = 0
label   = "Marges par défaut"
description = "Marges des quatre côtés d'un nouveau document, en millimètres. 0 conserve la valeur d'usine (25,4 mm, soit un pouce). La valeur est écrite DANS le document à sa création : les documents existants ne bougent pas, et un changement de politique ne les réécrit pas."
category = "Mise en page"
min     = 0
max     = 100
unit    = "mm"

[[settings]]
key     = "default_paper_size"
scope   = "global"
group   = "documents"
type    = "enum"
default = "a4"
label   = "Format de papier par défaut"
description = "Format de page d'un nouveau document. Écrit dans le document à sa création, comme les marges."
category = "Mise en page"
values  = [
    { value = "a4",     label = "A4 (210 × 297 mm)" },
    { value = "a5",     label = "A5 (148 × 210 mm)" },
    { value = "a3",     label = "A3 (297 × 420 mm)" },
    { value = "letter", label = "Letter (216 × 279 mm)" },
    { value = "legal",  label = "Legal (216 × 356 mm)" },
]

[[settings]]
key     = "track_changes_default"
scope   = "global"
group   = "documents"
type    = "bool"
default = false
label   = "Suivi des modifications activé par défaut"
description = "Un nouveau document s'ouvre avec le suivi des modifications déjà actif. L'auteur reste libre de le désactiver dans son document."
category = "Révision"

# NOTE: "spreadsheet_decimal_sep" reste NON déclaré. Contrairement aux marges et
# au suivi des modifications — qui vivent dans l'enveloppe du document et sont
# donc estampillables à la création — le séparateur décimal traverse la saisie,
# le moteur de formules, l'affichage et les imports/exports CSV du tableur. Rien
# ne le lit aujourd'hui : l'exposer serait décoratif.

[[settings]]
key     = "spreadsheet_default_format"
scope   = "global"
group   = "spreadsheet"
type    = "enum"
default = "xlsx"
label   = "Format tableur par défaut"
description = "Format appliqué à l'export et à la création de nouveaux tableurs."
values  = [
    { value = "xlsx", label = ".xlsx" },
    { value = "ods",  label = ".ods" },
    { value = "csv",  label = ".csv" },
]

[[settings]]
key     = "spreadsheet_autosave_s"
scope   = "global"
group   = "spreadsheet"
public  = true
type    = "enum"
default = 30
label   = "Sauvegarde automatique (tableur)"
description = "Délai entre deux enregistrements automatiques des tableurs. 0 désactive la sauvegarde automatique."
values  = [
    { value = 5,  label = "5 s" },
    { value = 30, label = "30 s" },
    { value = 60, label = "1 min" },
    { value = 0,  label = "Désactivé" },
]

[[settings]]
key     = "spreadsheet_header_row"
scope   = "global"
group   = "spreadsheet"
type    = "bool"
default = true
label   = "Première ligne = en-tête par défaut"
description = "Traite la première ligne des nouveaux tableurs comme une ligne d'en-tête."

# ── Présentations ─────────────────────────────────────────────────────────────

