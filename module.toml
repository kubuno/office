# ── Partage ───────────────────────────────────────────────────────────────────

[[settings]]
key     = "document_public_links_enabled"
scope   = "global"
group   = "sharing"
type    = "bool"
default = true
label   = "Autoriser les liens de partage public"
description = "Désactivé, plus aucun lien public n'est créé ET les liens déjà distribués cessent de répondre. Le partage nommé, entre membres de l'instance, n'est pas affecté."
category = "Liens publics"
risk    = "warning"

[[settings]]
key     = "document_share_max_permission"
scope   = "global"
group   = "sharing"
type    = "enum"
default = "edit"
label   = "Autorisation maximale d'un lien public"
description = "Le plus qu'un lien public puisse accorder. Une demande plus large est ramenée à cette valeur plutôt que refusée : l'utilisateur voulait partager, il partage — en plus étroit."
category = "Liens publics"
depends_on = "document_public_links_enabled"
values  = [
    { value = "view",    label = "Lecture seule" },
    { value = "comment", label = "Lecture et commentaires" },
    { value = "edit",    label = "Modification" },
]

[[settings]]
key     = "document_share_default_expiry_days"
scope   = "global"
group   = "sharing"
type    = "int"
default = 0
label   = "Expiration par défaut d'un lien public"
description = "Durée de vie appliquée à un lien créé sans date d'expiration. 0 = aucune, le lien ne s'éteint pas de lui-même."
category = "Liens publics"
min     = 0
max     = 3650
unit    = "jours"
depends_on = "document_public_links_enabled"

[[settings]]
key     = "document_share_max_expiry_days"
scope   = "global"
group   = "sharing"
type    = "int"
default = 0
label   = "Expiration maximale d'un lien public"
description = "Durée de vie maximale d'un lien public. 0 = pas de limite. Au-dessus de 0, un lien sans date d'expiration — ou avec une date plus lointaine — est ramené à cette durée."
category = "Liens publics"
min     = 0
max     = 3650
unit    = "jours"
depends_on = "document_public_links_enabled"

# ── Conservation ──────────────────────────────────────────────────────────────

[[settings]]
key     = "max_versions"
scope   = "global"
group   = "retention"
type    = "int"
default = 50
label   = "Révisions conservées par fichier"
description = "Nombre maximum de révisions gardées pour un document ou un classeur. Au-delà, la plus ancienne est supprimée à chaque nouvelle. Chaque révision de classeur est une copie complète du fichier : le plafond est aussi une facture de stockage."
category = "Historique"
min     = 1
max     = 1000
unit    = "révisions"

[[settings]]
key     = "trash_retention_days"
scope   = "global"
group   = "retention"
type    = "int"
default = 0
label   = "Rétention de la corbeille"
description = "Nombre de jours pendant lequel un élément mis à la corbeille est conservé avant sa suppression définitive automatique. 0 = jamais purgée, la corbeille garde tout jusqu'à ce qu'on la vide. La purge balaie tous les éditeurs de la suite, une fois par heure."
category = "Corbeille"
min     = 0
max     = 3650
unit    = "jours"
risk    = "warning"

[events]
subscribed = [
    "UserDeleted",
]
publishes = [
    "NoteCreated",
]
