# Kubuno Office — the mobile apps. ONE Cargo workspace for every mobile OS, laid out like the desktop apps
# (../desktop) and independent of the module server's (../server). Office is one module with several apps; like on
# the desktop, each app has its own crates, named after it (kubuno-office-<app>-mobile-…):
#
#   common/   each app, complete and portable: its .kbview screens (edited in Visual Studio), rendered by the shared
#             Kubuno mobile renderer — today Documents (kubuno-office-documents-mobile-common).
#   android/  only what Android does differently: each app's APK entry point (Documents: package
#             `com.kubuno.documents`, launcher icon) handing it to the shared Android shell. Built with cargo-apk on
#             a machine with the Android SDK/NDK (the .142 verification box, CI).
#   ios/      only what iOS does differently: each app's entry point handing it to the shared iOS shell. Built and
#             packaged into a .app on a Mac.
#
# The other Office apps (spreadsheets, presentations, …) join the same way, three crates each. The renderer and the
# Android / iOS shells are the core repository's (core/mobile), shared by every module's mobile apps; this repository
# holds the Office apps only.
[workspace]
resolver = "2"
members  = [
    "common/kubuno-office-documents-mobile-common",
    "android/kubuno-office-documents-mobile-android",
    "ios/kubuno-office-documents-mobile-ios",
]

[workspace.package]
version    = "0.1.0"   # the mobile app's own version (tags mobile-v<version>)
edition    = "2021"
license    = "AGPL-3.0-or-later"
repository = "https://github.com/kubuno/office"

[workspace.dependencies]
# The portable app.
kubuno-office-documents-mobile-common = { path = "common/kubuno-office-documents-mobile-common" }

# The shared mobile renderer and shells (core repository, core/mobile). Referenced from the sibling core checkout
# until core publishes a mobile tag; then they move to `git = "https://github.com/kubuno/core", tag = "…"` like the
# desktop framework. The shells are libraries here (`default-features = false`): this app provides its own entry
# points instead of the shells' standalone demo.
kubuno-mobile-render        = { path = "../../core/mobile/common/kubuno-mobile-render" }
kubuno-mobile-shell-android = { path = "../../core/mobile/android/kubuno-mobile-shell-android", default-features = false }
kubuno-mobile-shell-ios     = { path = "../../core/mobile/ios/kubuno-mobile-shell-ios", default-features = false }

# Same versions/features as the core mobile workspace (core/mobile/Cargo.toml), so the types match.
android-activity = { version = "0.6", features = ["native-activity"] }
tiny-skia        = { version = "0.11", default-features = false, features = ["std", "simd"] }

# The views are rasterised on the CPU: keep it fast even in debug builds (cargo-apk builds the dev profile).
[profile.dev.package."*"]
opt-level = 2
