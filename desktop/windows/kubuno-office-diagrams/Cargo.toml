[package]
name        = "kubuno-office-diagrams"
description = "Kubuno Diagrams for Windows (kubuno-diagrams.exe): the Win32 window of the diagram editor, written like a Windows Forms application (.kbview views, declarative ribbon, docked panels), and the entry point that registers it and runs the app of desktop/common"
version.workspace = true
edition.workspace = true
license.workspace = true

# The library holds everything the Visual Studio designer must link to render the views: the main form
# (`DiagramWindow`), its user controls and the custom controls (`DiagramCanvas`, `StencilPalette`, `LayerList`,
# `PageTabs`, `StatusZoom`), with the Windows half of the diagram engine (the Direct2D `Surface` the shared
# Canvas 2D context draws on). The binary is the short `Program.cs` (`main.rs`).
[lib]
name = "kubuno_office_diagrams"
path = "src/lib.rs"

[[bin]]
name = "kubuno-diagrams"
path = "src/main.rs"

[dependencies]
# The portable app: launch options, the diagram routes, the save session host.
kubuno-office-diagrams-common.workspace = true
# The diagram engine shared with the other clients (common/diagrams-core).
kubuno-office-diagrams-core.workspace = true
# The office client helpers shared with Documents (ids, the transport mapping).
kubuno-office-desktop-common.workspace = true
# The Kubuno desktop programming model; written `= { workspace = true }` (the views macros read this manifest).
kubuno-desktop = { workspace = true }
# The title bar's waffle and avatar, and their data through the shell's broker.
kubuno-desktop-shell-controls.workspace = true
kubuno-desktop-header-data.workspace    = true
# The Direct2D `Renderer` the canvas draws through.
kubuno-drive-desktop-app-controls.workspace = true
kubuno-desktop-sync.workspace = true
windows-numerics.workspace = true
serde_json.workspace = true

[dependencies.windows]
version  = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Imaging_D2D",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
]

[build-dependencies]
embed-manifest = "1.4"
winresource    = "0.1"
