[package]
name        = "kubuno-office-desktop"
description = "Kubuno Documents for Windows (kubuno-documents.exe): the Win32 window of the word processor, written like a Windows Forms application (.kbview views, declarative ribbon), and the entry point that registers it and runs the app of desktop/common"
version.workspace = true
edition.workspace = true
license.workspace = true

# The library holds everything the Visual Studio designer must link to render the views: the main
# form (`DocumentWindow`), the Backstage's user control (`BackstageInfo`) and the custom controls
# (`PageCanvas`, `HorizontalRuler`, `VerticalRuler`, `RulerCorner`, `ZoomSlider`), with the Windows half
# of the document engine they draw (DirectWrite measuring, Direct2D painting). The binary is the short
# `Program.cs` (`main.rs`): it registers the Windows platform and runs the app of desktop/common.
[lib]
name = "kubuno_office_desktop"
path = "src/lib.rs"

[[bin]]
name = "kubuno-documents"
path = "src/main.rs"

[dependencies]
# The portable app: the launch options, the open document's view state, the server session.
kubuno-office-desktop-common.workspace = true
# The Kubuno desktop programming model (Application::run, #[kubuno_desktop::view], custom and user controls,
# resources): it re-exports kubuno-desktop-views, kubuno-desktop-controls and kubuno-desktop-ui.
# Written `= { workspace = true }`, not `.workspace = true`: the views macros read this manifest to find the
# facade, and the framework at desktop-v0.1.1-alpha does not recognise the dotted key.
kubuno-desktop = { workspace = true }
# The title bar's waffle and avatar (`ShowWaffle` / `ShowAccount` place the shared `HeaderActions`), and their
# data: the account's apps and favourites through the shell's token broker.
kubuno-desktop-shell-controls.workspace = true
kubuno-desktop-header-data.workspace    = true
# The canvas contract and the Direct2D `Renderer` the page painter draws through (the design
# system's base, also re-exported by kubuno-desktop-ui).
kubuno-drive-desktop-app-controls.workspace = true
# The matrices the painter and the page transform hand to Direct2D.
windows-numerics.workspace = true
# The platform-neutral engine: the stored document, the layout and pagination engine ported from
# the web editor, the caret geometry and the editing operations (vskubuno docs/DOCUMENTS-EDITING.md).
kubuno-office-docs-core.workspace = true
# The HTTP client to the Kubuno core: the header's proxy setting.
kubuno-desktop-sync.workspace = true
serde_json.workspace = true

[dependencies.windows]
version  = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Globalization",
    "Win32_System_Threading",
]

[build-dependencies]
embed-manifest = "1.4"
winresource    = "0.1"
