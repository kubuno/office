[package]
name        = "kubuno-office-projects"
description = "Kubuno Projects for Windows (kubuno-projects.exe): the Win32 window of the project editor, written like a Windows Forms application (.kbview views, declarative ribbon), and the entry point that registers it and runs the app of desktop/common"
version.workspace = true
edition.workspace = true
license.workspace = true

# The library holds everything the Visual Studio designer must link to render the views: the main form
# (`ProjectWindow`), its dialogs and user controls, and the custom controls (`GanttView`, `TimelineBand`,
# `BoardView`, `MonthView`, `LoadView`, `PlanTabs`). The binary is the short `Program.cs` (`main.rs`): it
# registers the Windows platform and runs the app of desktop/common.
[lib]
name = "kubuno_office_projects"
path = "src/lib.rs"

[[bin]]
name = "kubuno-projects"
path = "src/main.rs"

[dependencies]
# The portable app: launch options, the server session, the column layout.
kubuno-office-projects-common.workspace = true
# The shared ribbon rule: only the « Fichier » tab until a document is open (like the web's ModuleHome).
kubuno-office-desktop-shared.workspace = true
# The project engine (common/projects-core).
kubuno-office-projects-core.workspace = true
# The Kubuno desktop programming model (Application::run, #[kubuno_desktop::view], custom and user controls,
# resources). Written `= { workspace = true }`: the views macros read this manifest to find the facade.
kubuno-desktop = { workspace = true }
# The title bar's waffle and avatar, and their data.
kubuno-desktop-shell-controls.workspace = true
kubuno-desktop-header-data.workspace    = true
# The HTTP client to the Kubuno core: the header's proxy setting.
kubuno-desktop-sync.workspace = true
serde_json.workspace = true

[dependencies.windows]
version  = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-manifest = "1.4"
winresource    = "0.1"
