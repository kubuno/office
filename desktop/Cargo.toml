# Kubuno Documents: the desktop word processor of the Office module. ONE Cargo workspace for every operating
# system, independent of the server's (../server/Cargo.toml):
#
#   common/   the complete app, portable: the launch options, the open document's view state, the server
#             session (routes, save rules, crash journal, live thread) and the platform extension points
#             (traits with portable defaults, `platform.rs`)
#   windows/  only what Windows does differently: the Win32 window painted with Direct2D (the .kbview views,
#             the ribbon, the rulers and the page canvas, DirectWrite measuring, the clipboard, the IME, WIC
#             images) and the `kubuno-documents.exe` entry point that registers it
#   linux/, macos/  thin entry points running the common app with the portable defaults
#
# The document engine is the module's shared core (../common/core, kubuno-office-docs-core). The Kubuno
# desktop framework (kubuno-desktop and the layers it re-exports, the shell's header controls and data, the
# painting surface) and the common crates of Kubuno Desktop (sync, account) come from the core repository
# (desktop/) by git tag, never by path: the app builds from this repository alone and links the framework
# statically. The Windows-only crates are built on Windows only (CI selects the packages per OS: `-p`).
[workspace]
resolver = "2"
members  = [
    "common/kubuno-office-documents-common",
    "common/kubuno-office-desktop-shared",
    "common/kubuno-office-spreadsheets-common",
    "common/kubuno-office-maths-common",
    "common/kubuno-office-diagrams-common",
    "common/kubuno-office-presentations-common",
    "common/kubuno-office-projects-common",
    "common/kubuno-office-whiteboard-common",
    "common/kubuno-office-data-common",
    "windows/kubuno-office-documents",
    "windows/kubuno-office-diagrams",
    "windows/kubuno-office-presentations",
    "windows/kubuno-office-spreadsheets",
    "windows/kubuno-office-maths",
    "windows/kubuno-office-projects",
    "windows/kubuno-office-whiteboard",
    "windows/kubuno-office-data",
    "linux/kubuno-office-documents-linux",
    "macos/kubuno-office-documents-macos",
]

[workspace.package]
version    = "0.1.0"   # Kubuno Documents' own version
edition    = "2021"
license    = "AGPL-3.0-or-later"
repository = "https://github.com/kubuno/office"

[workspace.dependencies]
kubuno-office-documents-common = { path = "common/kubuno-office-documents-common" }
# The save session and its live thread, shared by every Office desktop app.
kubuno-office-desktop-shared = { path = "common/kubuno-office-desktop-shared" }
# The document engine every Office client shares.
kubuno-office-docs-core      = { path = "../common/core" }
# Kubuno Spreadsheets: its portable app and the spreadsheet engine every Office client shares.
kubuno-office-spreadsheets-common = { path = "common/kubuno-office-spreadsheets-common" }
kubuno-office-sheets-core         = { path = "../common/sheets-core" }
# LaTeX equations laid out as KaTeX renders them (a Rust port of KaTeX, with its fonts), plus the Maths
# workbench engine (module `engine`): the expression tree, CAS, matrices, stats, graphs and stored document.
kubuno-office-math-core           = { path = "../common/math-core" }
# Kubuno Maths: its portable app (the Maths workbench engine lives in math-core above).
kubuno-office-maths-common        = { path = "common/kubuno-office-maths-common" }
# Kubuno Diagrams: its portable app and the diagram engine every Office client shares.
kubuno-office-diagrams-common = { path = "common/kubuno-office-diagrams-common" }
kubuno-office-diagrams-core   = { path = "../common/diagrams-core" }
# Kubuno Presentations: its portable app and the presentation engine every Office client shares.
kubuno-office-presentations-common = { path = "common/kubuno-office-presentations-common" }
kubuno-office-slides-core          = { path = "../common/slides-core" }
# Kubuno Projects: its portable app and the project engine every Office client shares.
kubuno-office-projects-common = { path = "common/kubuno-office-projects-common" }
kubuno-office-projects-core   = { path = "../common/projects-core" }
# Kubuno Whiteboard: its portable app and the whiteboard engine every Office client shares.
kubuno-office-whiteboard-common = { path = "common/kubuno-office-whiteboard-common" }
kubuno-office-whiteboard-core   = { path = "../common/whiteboard-core" }
# Kubuno Data: its portable app and the Data (BI) engine every Office client shares.
kubuno-office-data-common = { path = "common/kubuno-office-data-common" }
kubuno-office-data-core   = { path = "../common/data-core" }

# One tag of the core repository pins every framework and common crate (core desktop/README.md,
# "Versions and tags"). Bump them together.
kubuno-desktop                    = { git = "https://github.com/kubuno/core", tag = "desktop-v0.1.2-alpha" }
kubuno-desktop-shell-controls     = { git = "https://github.com/kubuno/core", tag = "desktop-v0.1.2-alpha" }
kubuno-desktop-header-data        = { git = "https://github.com/kubuno/core", tag = "desktop-v0.1.2-alpha" }
kubuno-drive-desktop-app-controls = { git = "https://github.com/kubuno/core", tag = "desktop-v0.1.2-alpha" }
kubuno-desktop-sync               = { git = "https://github.com/kubuno/core", tag = "desktop-v0.1.2-alpha" }
kubuno-desktop-account            = { git = "https://github.com/kubuno/core", tag = "desktop-v0.1.2-alpha" }
# One window per document (kubuno-office-desktop-shared `single`): Kubuno Desktop's single-instance primitive
# (since desktop-v0.1.2-alpha).
kubuno-desktop-single-instance    = { git = "https://github.com/kubuno/core", tag = "desktop-v0.1.2-alpha" }

windows-numerics = "0.3"
serde            = { version = "1", features = ["derive"] }
# `raw_value` is what makes the round trip lossless: every subtree this app does not model is carried as the
# original bytes. `float_roundtrip` keeps the numbers it does parse exact.
serde_json       = { version = "1", features = ["raw_value", "float_roundtrip"] }
tracing          = "0.1"
