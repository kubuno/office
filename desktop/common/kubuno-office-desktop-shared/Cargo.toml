[package]
name        = "kubuno-office-desktop-shared"
description = "What every Kubuno Office desktop app shares to talk to the server: the save session (digest guard, editing session, conflict, crash-journal rules) and the live thread that runs it for an open window"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

# Portable on purpose: no `windows` crate, no UI framework, no REST client — the apps plug their routes in
# through the session's `Server` and `Journal` traits (Documents: kubuno-office-desktop-common; Spreadsheets,
# Diagrams, Presentations: their own common crates).
[dependencies]
serde_json.workspace = true
tracing.workspace    = true
# The collaboration room's WebSocket (blocking, on its own thread). The same version and TLS stack as
# kubuno-desktop-sync (rustls + webpki roots): no system OpenSSL, nothing new to build on any OS.
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# One window per document (`single`): Kubuno Desktop's single-instance primitive (lock + hand-off + focus).
kubuno-desktop-single-instance.workspace = true
