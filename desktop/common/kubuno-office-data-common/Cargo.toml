[package]
name        = "kubuno-office-data-common"
description = "Kubuno Data, the portable app: the launch options, the open project and its editor, the server path (the project routes, the outbox worker that sends the editor's changes in order, the journal of unsent work) and the platform extension points every OS entry point registers"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

# Portable on purpose: no `windows` crate, no UI framework (desktop/README.md). The native user interfaces live
# in the OS folders (desktop/windows: the Win32 window painted through the framework's Graphics).
[dependencies]
# The project engine shared with the other clients (common/projects-core).
kubuno-office-data-core.workspace = true
# The REST transport through the shell's token broker, shared with the other Office apps.
kubuno-office-desktop-common.workspace = true
# One window per document (`single`).
kubuno-office-desktop-shared.workspace = true
# The HTTP client to the Kubuno core through the shell's token broker, and the account's paths (the journal).
kubuno-desktop-sync.workspace    = true
kubuno-desktop-account.workspace = true
serde.workspace      = true
serde_json.workspace = true
tracing.workspace    = true
# A `.kbprj` from Drive is gzipped JSON (pure Rust backend).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# A direct blocking HTTP transport for `--live` development against a dev core, when the shell's token broker
# is not signed in (reads the base URL and admin credentials from the environment, never hardcoded). The
# production path stays the broker (`SyncTransport`). reqwest is already in the desktop lock (rustls).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
